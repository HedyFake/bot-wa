# Dev services (alternatif bila tidak memakai install.sh). Port hanya bind localhost.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hdybot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
      POSTGRES_DB: hdybot
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdybot"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
volumes:
  pgdata:
